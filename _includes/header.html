{% assign current = page.url %}
<header class="site-header">
  <div class="container">
    <a class="brand" href="{{ '/Front_Page.html' | relative_url }}">SMME</a>
    <nav class="nav">
      <a href="{{ '/Front_Page.html' | relative_url }}"
         class="{% if current == '/Front_Page.html' or current == '/' %}active{% endif %}">Home</a>
      <a href="{{ '/about.html' | relative_url }}"
         class="{% if current contains '/about' %}active{% endif %}">About</a>
      <a href="{{ '/work.html' | relative_url }}"
         class="{% if current contains '/work' %}active{% endif %}">Work</a>
      <a href="{{ '/contacts.html' | relative_url }}"
         class="{% if current contains '/contacts' %}active{% endif %}">Contact</a>
    </nav>
  </div>
</header>
