---
layout: default
title: Diary
---

<section class="diary">
  <div class="container">
    <h1>Diary</h1>
    <div class="diary__list">
      {% assign posts = site.categories.diary | sort: "date" | reverse %}
      {% for post in posts %}
        <a class="card" href="{{ post.url | relative_url }}">
          {% if post.image %}
            <img src="{{ post.image }}" alt="{{ post.title | escape }}">
          {% endif %}
          <h3>{{ post.title }}</h3>
          <p class="meta">{{ post.date | date: "%d %b %Y" }}</p>
        </a>
      {% endfor %}
    </div>
  </div>
</section>
