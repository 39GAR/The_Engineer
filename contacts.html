---
layout: default
title: Contact
---

<section class="contact">
  <div class="container">
    <h1>Start a project</h1>
    <p>Tell me a bit about your business and what you need. I’ll reply within 24–48h.</p>

    <form action="https://formsubmit.co/smmebooking07@gmail.com" method="POST" class="contact__form">
      <input type="hidden" name="_subject" value="New project inquiry">
      <input type="hidden" name="_template" value="table">
      <input type="text" name="_honey" style="display:none">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_next" value="contacts-thanks.html">

      <label>
        Your name
        <input type="text" name="name" required>
      </label>

      <label>
        Email
        <input type="email" name="email" required>
      </label>

      <label>
        Project type
        <select name="project">
          <option>Portfolio / Brand site</option>
          <option>Business website</option>
          <option>E-commerce</option>
          <option>Something else</option>
        </select>
      </label>

      <label>
        Message
        <textarea name="message" rows="5" required></textarea>
      </label>

      <button class="btn btn--primary" type="submit">Send</button>
    </form>
  </div>
</section>
